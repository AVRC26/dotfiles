[shell]
format = "[](fg:color_bg)[ $indicator ]($style)(bg:color_bg)"
style = 'fg:color_seg0 bg:color_bg'
disabled = false
bash_indicator = ''
fish_indicator='󰈺'
zsh_indicator="󰰶"
powershell_indicator = ''
cmd_indicator = ''
ion_indicator = ''
elvish_indicator = "󰘧"
tcsh_indicator = "󰰤"
nu_indicator = "❯"
xonsh_indicator = ""
unknown_indicator = ''

[username]
format = '[](bg:color_bg fg:color_text bold)[ $user ]($style)[ ](bg:color_bg)'
style_user = 'bg:color_bg fg:color_text'
style_root = 'bg:color_bg fg:color_err bold'
show_always = true
disabled = false

[hostname]
ssh_only = false
style    = "bg:color_bg fg:color_text"
format   = "[ $hostname ](bg:color_bg fg:color_text)"

[sudo]
format = '[ $symbol ]($style)'
style = 'fg:color_seg0 bg:color_bg'
symbol = ''
disabled = false

[shlvl]
symbol = ''
disabled = false
format   = '[ $symbol $shlvl ]($style)'
style    = 'fg:color_seg0 bg:color_bg'


[directory]
format = '[ ](fg:color_seg1 bg:color_bg)[$read_only$path ]($style)'
style = 'fg:color_seg1 bg:color_bg'
read_only = '󰌾 '
home_symbol=" "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[direnv]
symbol = 'direnv'
style = 'fg:color_seg5 bold bg:color_bg'
format = "[❯ $symbol $loaded/$allowed ]($style)"
allowed_msg = 'a' # 'ok' # '✓'
not_allowed_msg = '!a' # 'nok' # '!'
denied_msg = 'x' # '✘'
loaded_msg = '+' # "\ueabc" # \ueabc  # '->' # 'yo' # '󰗡' # \udb81\udde1 # '󱥸✓' # '󱥸✓' # 
unloaded_msg = '-' # "\ueabc!" # \ueabc ! # '->!' # 'no' # '󰅚' # '󱥸!' \udb86\udd78
disabled = false

[git_branch]
format = '[ $symbol $branch(:$remote_branch)]($style)[ ](bg:color_bg)'
style = 'fg:color_seg2 bg:color_bg'
symbol = ''

[git_commit]
format = '[\($hash$tag\)]($style)[ ](bg:color_bg)'
style = 'fg:color_seg2 bg:color_bg'
commit_hash_length = 8
tag_symbol = '  ' # '  ''
tag_disabled = false
disabled = false

[git_metrics]
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
added_style = 'fg:color_seg2 bg:color_bg'
deleted_style = 'fg:color_seg2 bg:color_bg'
disabled = false

[git_status]
style  = "bg:color_bg fg:color_seg2"
format = '([ $all_status$ahead_behind ]($style))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

#[git_status]
#format = '([$all_status$ahead_behind]($style))'
#style = 'fg:color_seg2 bg:color_bg'
#conflicted = '[${count} ](fg:color_err bg:color_bg)'
#ahead = '[⇡${count} ](fg:color_warn bg:color_bg)'
#behind = '[⇣${count} ](fg:color_warn bg:color_bg)'
#diverged = '[⇕${ahead_count}⇡${behind_count}⇣ ](fg:color_warn bg:color_bg)' # ⇕ ↕ ⇳ 󰹹 󰹺 󰧈
#up_to_date = '[✓ ](fg:color_ok bg:color_bg)'
#untracked = '[${count} ](fg:color_err bg:color_bg)' # ' ' # '? '
#stashed = '[${count} ](fg:color_err bg:color_bg)' # '📦 '# ' ' # ' ' # ' ' # ' '
#modified = '[󰷉${count} ](fg:color_warn bg:color_bg)' # '📝' # '! ' #  #  # 
#staged = '[${count} ](fg:color_ok bg:color_bg)' # '+ '
#renamed = '[ᴂ${count} ](fg:color_warn bg:color_bg)' # ' ' # '﫦' # ᴂ #  #  #  # ﳳ
#deleted = '[🗑${count} ](fg:color_seg0 bg:color_bg)' # '🗑 ' '- '
#disabled = false

