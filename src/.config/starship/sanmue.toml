threshold = -1
disabled = false

[custom.cpu_load]
description = "1-minute load average"
command = "awk '{print $1}' /proc/loadavg"
symbol = "󰻠"
format = "[ ](fg:color_seg2 bold bg:color_bg)[$symbol $output ]($style)"
style = 'fg:color_seg2 bg:color_bg'
when = "true"

[custom.disk_usage]
description = "Used % of root filesystem"
command = "df -h / | awk 'NR==2{print $5}'"
symbol = "󰋊"
format = "[ ](fg:color_seg3 bold bg:color_bg)[$symbol $output ]($style)"
style = 'fg:color_seg3 bg:color_bg'
when = "true"

[cmd_duration]
format = "[   $duration ]($style)" # \ueab5 \uf017   
style = 'fg:color_seg4 bg:color_bg'
disabled = false

[battery]
format = "[ $symbol $percentage ](fg:color_seg5 bg:color_bg)"
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰁽"
empty_symbol = "󰂎"
disabled = true

[[battery.display]]
threshold = 100

