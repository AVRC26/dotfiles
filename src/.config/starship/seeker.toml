# Starship Prompt — seeker layout, colors driven by set-theme.
# Credit: https://github.com/starship/starship/discussions/1107#discussioncomment-13575853

format = """
[╭─](bg:none fg:color_seg0)\
$shell\
$sudo\
$shlvl\
$env_var\
[](fg:color_seg0 bg:color_seg1)\
$memory_usage\
${custom.cpu_load}\
${custom.disk_usage}\
$cmd_duration\
[](fg:color_seg4 bg:color_seg5)\
$battery\
$status\
$jobs\
[](fg:color_seg5 bg:none)\
$line_break\
[├─](bg:none fg:color_seg0)\
$os\
[ ](bg:color_bg fg:color_seg0)\
$username\
$hostname\
[](bg:color_seg1 fg:color_bg)\
[ ](bg:color_seg1 fg:color_fg)\
$directory\
[ ](bg:color_seg1)\
[](bg:color_seg2 fg:color_seg1)\
$git_branch\
$git_status\
$git_commit\
$git_metrics\
[](fg:color_seg2 bg:color_seg3)\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haxe\
$helm\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mise\
$mojo\
$nats\
$nim\
$nix_shell\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$red\
$rlang\
$ruby\
$scala\
$rust\
$spack\
$swift\
$typst\
$vagrant\
