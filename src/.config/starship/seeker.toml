palette = 'theme'

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[os]
format   = "[ $symbol]($style)()"
style    = "bg:color_seg0 fg:color_bg"
disabled = false

[os.symbols]
AIX = "➿"
Alpaquita = ""
Alpine = ""
AlmaLinux = ""
ALTLinux = "Ⓐ"
Amazon = ""
Android = ""
AOSC = "🐱"
Arch = ""
Artix = ""
Bluefin = "🐟"
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
Elementary = "🍏"
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = ""
Ios = "📱"
InstantOS = "⏲️"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = ""
OpenCloudOS = ""
openEuler = ""
openSUSE = ""
OracleLinux = ""
PikaOS = "🐤"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Redox = "󰀘"
RockyLinux = ""
Solus = "󰠳"
SUSE = ""
Ubuntu = ""
Ultramarine = "󰼮"
Unknown = ""
Void = ""
Windows = ""
Zorin = "🔹"

[username]
show_always = true
style_user  = "bg:color_bg fg:color_text"
style_root  = "bg:color_bg fg:color_err bold"
format      = '[$user ]($style)'

[hostname]
format   = '[ $hostname ](bg:color_bg fg:color_text)'
ssh_only = false
disabled = false

[fill]
symbol = ' '
style  = 'bold fg:color_seg5'

[directory]
style             = "bg:color_seg1 fg:color_fg"
format            = '[$read_only$path]($style)'
read_only = '󰌾 '
home_symbol=" "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[git_branch]
symbol = ""
style  = "bg:color_seg2"
format = '[[ $symbol $branch ](fg:color_fg bg:color_seg2)]($style)'

[git_commit]
only_detached      = true
format             = '[\($hash$tag\)]($style)[ ]()'
style              = 'bg:color_seg2'
commit_hash_length = 8
tag_symbol         = '  '
tag_disabled       = false
disabled           = false

[git_metrics]
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
added_style   = 'bg:color_seg2 fg:color_fg'
deleted_style = 'bg:color_seg2 fg:color_fg'
disabled      = false

[git_status]
style  = "bg:color_seg2"
format = '[[($all_status$ahead_behind )](fg:color_fg bg:color_seg2)]($style)'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[status]
format         = "[[ $status:$common_meaning ](fg:color_err bg:color_seg5)]($style)"
style          = 'bg:color_seg5 fg:color_err'
disabled       = false

[buf]
symbol = ""
style  = "bg:color_seg3"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_seg3)]($style)'

