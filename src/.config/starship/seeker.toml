[memory_usage]
format    = "[ $symbol${ram_pct} ](bg:color_seg1 fg:color_fg)[](bg:color_seg2 fg:color_seg1)"
symbol    = "󰍛"
threshold = -1
disabled  = false

[custom.cpu_load]
description = "1-minute load average"
command = "awk '{print $1}' /proc/loadavg"
symbol = "󰻠"
format = "[ $symbol $output ](bg:color_seg2 fg:color_fg)[](bg:color_seg3 fg:color_seg2)"
when = "true"

[custom.disk_usage]
description = "Used % of root filesystem"
command = "df -h / | awk 'NR==2{print $5}'"
symbol = "󰋊"
format = "[ $symbol $output ](bg:color_seg3 fg:color_fg)[](bg:color_seg4 fg:color_seg3)"
when = "true"

[time]
format   = "[](fg:color_seg0)[ $time ](bg:color_seg0 fg:color_bg)"
disabled = false

[cmd_duration]
format             = '[  $duration ](bg:color_seg4 fg:color_bg)'
min_time           = 500
disabled           = false
show_notifications = false

[shell]
disabled = false
bash_indicator = ''
fish_indicator='󰈺'
zsh_indicator="󰰶"
powershell_indicator = ''
cmd_indicator = ''
ion_indicator = ''
elvish_indicator = "󰘧"
tcsh_indicator = "󰰤"
nu_indicator = "❯"
xonsh_indicator = ""
unknown_indicator = ''
format   = '[[ $indicator ](fg:color_fg bg:color_seg0)]($style)'

[sudo]
symbol = ''
disabled = false
format   = '[[ $symbol ](fg:color_fg bg:color_seg0)]($style)'

[shlvl]
symbol = ''
disabled = false
format   = '[[ $symbol $shlvl ](fg:color_fg bg:color_seg0)]($style)'

[jobs]
symbol = ''
number_threshold = 1
symbol_threshold = 1
disabled = false
format           = '[[ $symbol $number ](fg:color_fg bg:color_seg5)]($style)'


[character]
success_symbol = '[❯](bold blink fg:color_ok)'
error_symbol   = '[❯](bold blink fg:color_err)'
vimcmd_symbol  = '[❯](bold fg:color_ok)' 

[battery]
disabled = true
format             = '[[ $symbol $percentage ](fg:color_fg bg:color_seg5)]($style)'
style              = 'bg:color_seg5'

full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰁽"
empty_symbol = "󰂎"