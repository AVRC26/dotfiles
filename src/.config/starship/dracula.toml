format             = '[─](fg:color_seg6)[](fg:color_seg6)[ $symbol ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg6)[ $percentage ](fg:color_bg bg:color_seg6)[](fg:color_seg6)'
