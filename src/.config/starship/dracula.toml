[memory_usage]
format    = '[─](fg:color_seg6)[](fg:color_seg6)[ 󰍛 ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg1)[ ${ram_pct} ](fg:color_bg bg:color_seg1)[](fg:color_seg1)'
threshold = -1
disabled  = false

[custom.cpu_load]
description = "1-minute load average"
command     = "awk '{print $1}' /proc/loadavg"
when        = "true"
format      = '[─](fg:color_seg6)[](fg:color_seg6)[ 󰻠 ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg2)[ $output ](fg:color_bg bg:color_seg2)[](fg:color_seg2)'

[custom.disk_usage]
description = "Used % of root filesystem"
command     = "df -h / | awk 'NR==2{print $5}'"
when        = "true"
format      = '[─](fg:color_seg6)[](fg:color_seg6)[  󰋊 ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg3)[ $output ](fg:color_bg bg:color_seg3)[](fg:color_seg3)'

[fill]
symbol = '─'
style  = 'fg:color_seg6'

[cmd_duration]
format   = '[─](fg:color_seg6)[](fg:color_seg6)[  ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg4)[ $duration ](fg:color_bg bg:color_seg4)[](fg:color_seg4)'
