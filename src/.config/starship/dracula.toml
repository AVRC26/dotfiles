# Starship Prompt — dracula layout, colors driven by set-theme.
# Credit: https://github.com/starship/starship/discussions/1107#discussioncomment-11130385

format = """
[╭](fg:color_seg5)\
$os\
$username\
$hostname\
$directory\
($git_branch\
$git_status\
$git_commit\
$git_metrics\
[](fg:color_seg5)\
)\
$fill\
$nodejs\
$dotnet\
$python\
$java\
$c\
$cmd_duration\
$shell\
$time\
$line_break\
$character\
"""

palette = 'theme'
add_newline = true

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

# Module format pattern:
#   [─](fg:color_seg5)                          — connector
#   [](fg:ACCENT)[$icon](fg:color_bg bg:ACCENT)  — icon pill
#   [](fg:ACCENT bg:color_seg5)                  — transition
#   [ $content](fg:color_bg bg:color_seg5)     — text box
#   [](fg:color_seg5)                            — close

[os]
format = '[](fg:color_seg0)[$symbol ](fg:color_bg bg:color_seg0)[](fg:color_seg0)'
disabled = false

[os.symbols]
Alpine           = '󰌓'
Amazon           = '󰌓'
Android          = '󰀲'
Arch             = '󰄇'
CentOS           = '󰕗'
Debian           = '󰍺'
EndeavourOS      = '󰌓'
Fedora           = '󰍻'
FreeBSD          = '󰌓'
Garuda           = '󰌓'
Gentoo           = '󰏨'
Linux            = '󰌓'
Macos            = '󰅵'
Manjaro          = '󰏷'
Mariner          = '󰌓'
Mint             = '󰍨'
NetBSD           = '󰌓'
NixOS            = '󱄅'
OpenBSD          = '󰌓'
OpenCloudOS      = '󰌓'
openEuler        = '󰌓'
openSUSE         = '󰮂'
OracleLinux      = '⊂⊃'
Pop              = '󰪠'
Raspbian         = '󰃿'
Redhat           = '󱄛'
RedHatEnterprise = '󱄛'
Solus            = '󰌓'
SUSE             = '󰮂'
Ubuntu           = ''
Unknown          = '󰠥'
Windows          = '󰍲'

[hostname]
ssh_only = false
style    = "fg:color_bg bg:color_seg0"
format      = '[─](fg:color_seg5)[](fg:color_text)[ ](fg:color_bg bg:color_text)[](fg:color_text bg:color_seg5)[ $hostname](fg:color_bg bg:color_seg5)[](fg:color_seg5)'

[directory]
format = '[─](fg:color_seg5)[](fg:color_seg1)[󰷏 ](fg:color_bg bg:color_seg1)[](fg:color_seg1 bg:color_seg5)[ $read_only$truncation_symbol$path](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
home_symbol       = " ~/"
truncation_symbol = ' '
truncation_length = 0
truncate_to_repo  = false
read_only         = '󱧵 '
read_only_style   = ''

[git_branch]
format = '[─](fg:color_seg5)[](fg:color_seg2)[  ](fg:color_bg bg:color_seg2)[](fg:color_seg2 bg:color_seg5)[ $branch](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = ' '


[git_status]
style  = 'bg:color_seg5 fg:color_bg'
format = '([ $all_status$ahead_behind ]($style))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'bg:color_seg5 fg:color_fg'
format             = '([$hash$tag ]($style))'

[git_metrics]
added_style   = 'bg:color_seg5 fg:color_fg'
deleted_style = 'bg:color_seg5 fg:color_fg'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false

[nodejs]
format = '[─](fg:color_seg5)[](fg:color_seg2)[$symbol](fg:color_bg bg:color_seg2)[](fg:color_seg2 bg:color_seg5)[ $version](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = '󰎙 Node.js'

[dotnet]
format = '[─](fg:color_seg5)[](fg:color_seg3)[$symbol](fg:color_bg bg:color_seg3)[](fg:color_seg3 bg:color_seg5)[ $tfm](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = ' .NET'

[python]
format = '[─](fg:color_seg5)[](fg:color_seg2)[$symbol](fg:color_bg bg:color_seg2)[](fg:color_seg2 bg:color_seg5)[ $version](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = ' python'

[java]
format = '[─](fg:color_seg5)[](fg:color_seg0)[$symbol](fg:color_bg bg:color_seg0)[](fg:color_seg0 bg:color_seg5)[ $version](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = ' Java'

[c]
format = '[─](fg:color_seg5)[](fg:color_seg4)[$symbol](fg:color_bg bg:color_seg4)[](fg:color_seg4 bg:color_seg5)[ $version](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
symbol = ' C'

[fill]
symbol = '─'
style  = 'fg:color_seg5'

[cmd_duration]
min_time = 500
format   = '[─](fg:color_seg5)[](fg:color_warn)[ ](fg:color_bg bg:color_warn)[](fg:color_warn bg:color_seg5)[ $duration ](fg:color_bg bg:color_seg5)[](fg:color_seg5)'

[shell]
format              = '[─](fg:color_seg5)[](fg:color_seg4)[ ](fg:color_bg bg:color_seg4)[](fg:color_seg4 bg:color_seg5)[ $indicator](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
unknown_indicator   = 'shell'
powershell_indicator = 'powershell'
fish_indicator      = 'fish'
disabled            = false

[time]
format      = '[─](fg:color_seg5)[](fg:color_seg3)[󰦖 ](fg:color_bg bg:color_seg3)[](fg:color_seg3 bg:color_seg5)[ $time](fg:color_bg bg:color_seg5)[](fg:color_seg5) '
disabled    = false

[username]
format      = '[─](fg:color_seg5)[](fg:color_text)[󰀄 ](fg:color_bg bg:color_text)[](fg:color_text bg:color_seg5)[ $user](fg:color_bg bg:color_seg5)[](fg:color_seg5)'
show_always = true

[character]
format         = "[╰─$symbol](fg:color_seg5) "
success_symbol = '[❯](bold blink fg:color_ok)'
error_symbol   = '[❯](bold blink fg:color_err)'
vimcmd_symbol  = '[❮](bold fg:color_ok)'
