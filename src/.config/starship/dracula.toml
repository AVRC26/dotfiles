style     = 'fg:color_bg bg:color_seg6'

[status]
disabled = false
format   = '[─](fg:color_seg6)[](fg:color_seg6)[ $status ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg6)[ $common_meaning ](fg:color_bg bg:color_seg6)[](fg:color_seg6)'

[jobs]
symbol           = ''
number_threshold = 1
symbol_threshold = 1
format           = '[─](fg:color_seg6)[](fg:color_seg6)[ $symbol ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg6)[ $number ](fg:color_bg bg:color_seg6)[](fg:color_seg6)'
