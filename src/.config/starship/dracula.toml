# Starship Prompt — dracula layout, colors driven by set-theme.
# Credit: https://github.com/starship/starship/discussions/1107#discussioncomment-11130385

format = """
[╭](fg:color_seg6)\
$shell\
$sudo\
$shlvl\
$env_var\
$memory_usage\
${custom.cpu_load}\
${custom.disk_usage}\
$cmd_duration\
$battery\
$status\
$jobs\
$line_break\
[├╴](fg:color_seg6)\
$os\
$username\
$hostname\
$directory\
($git_branch\
$git_status\
$git_commit\
$git_metrics\
[](fg:color_seg2)\
)\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
