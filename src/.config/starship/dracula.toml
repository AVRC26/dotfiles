$character\
"""

palette     = 'theme'
add_newline = true

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_seg6 = "{{COLOR_SEG6}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

# Module format pattern:
#   [─](fg:color_seg6)                          — connector
#   [](fg:ACCENT)[$icon](fg:color_bg bg:ACCENT)  — icon pill
#   [](fg:ACCENT bg:color_seg6)                  — transition
#   [ $content](fg:color_bg bg:color_seg6)     — text box
#   [](fg:color_seg6)                            — close

[os]
format   = '[](fg:color_seg0)[ $symbol ](fg:color_bg bg:color_seg0)[](fg:color_seg0)'
disabled = false

[os.symbols]
AIX              = '➿'
Alpaquita        = ''
Alpine           = ''
AlmaLinux        = ''
ALTLinux         = 'Ⓐ'
Amazon           = ''
Android          = ''
AOSC             = '🐱'
Arch             = ''
Artix            = ''
Bluefin          = '🐟'
CachyOS          = ''
CentOS           = ''
Debian           = ''
DragonFly        = ''
Elementary       = '🍏'
Emscripten       = ''
EndeavourOS      = ''
Fedora           = ''
FreeBSD          = ''
Garuda           = '󰛓'
Gentoo           = ''
HardenedBSD      = '󰞌'
Illumos          = ''
Ios              = '📱'
InstantOS        = '⏲️'
Kali             = ''
Linux            = ''
Mabox            = ''
Macos            = ''
Manjaro          = ''
Mariner          = ''
MidnightBSD      = ''
Mint             = ''
NetBSD           = ''
NixOS            = ''
Nobara           = ''
OpenBSD          = ''
OpenCloudOS      = ''
openEuler        = ''
openSUSE         = ''
OracleLinux      = ''
PikaOS           = '🐤'
Pop              = ''
Raspbian         = ''
Redhat           = ''
RedHatEnterprise = ''
Redox            = '󰀘'
RockyLinux       = ''
Solus            = '󰠳'
SUSE             = ''
Ubuntu           = ''
Ultramarine      = '󰼮'
Unknown          = ''
Void             = ''
Windows          = ''
Zorin            = '🔹'

[hostname]
ssh_only = false
style    = "fg:color_bg bg:color_seg0"
format   = '[─](fg:color_seg6)[](fg:color_seg6)[  ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_bg)[ $hostname](fg:color_text bg:color_bg)[](fg:color_bg)'

[directory]
format            = '[─](fg:color_seg6)[](fg:color_seg6)[ 󰷏 ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg1)[ $read_only$path](fg:color_bg bg:color_seg1)[](fg:color_seg1)'
read_only         = '󰌾 '
home_symbol       = " "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[git_branch]
format = '[─](fg:color_seg6)[](fg:color_seg6)[  ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg2)[ $branch](fg:color_bg bg:color_seg2)[](fg:color_seg2)'
symbol = ''

[git_status]
style       = 'bg:color_seg2 fg:color_bg'
format      = '([ $all_status$ahead_behind ]($style))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'bg:color_seg2 fg:color_fg'
format             = '([$hash$tag ]($style))'

[git_metrics]
added_style   = 'bg:color_seg2 fg:color_fg'
deleted_style = 'bg:color_seg2 fg:color_fg'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false

