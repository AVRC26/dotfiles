format = '[─](fg:color_seg6)[](fg:color_seg6)[  ](fg:color_bg bg:color_seg6)[](fg:color_seg6 bg:color_seg3)[ $version](fg:color_bg bg:color_seg3)[](fg:color_seg3)'

