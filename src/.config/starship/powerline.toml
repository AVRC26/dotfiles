[memory_usage]
disabled  = false
threshold = -1
style     = "bg:color_seg1"
format    = '[[ 󰍛 ${ram_pct} ](fg:color_fg bg:color_seg1)]($style)'

[custom.cpu_load]
description = "1-minute load average"
command     = "awk '{print $1}' /proc/loadavg"
when        = "true"
style       = "bg:color_seg2"
format      = '[[ 󰻠 $output ](fg:color_fg bg:color_seg2)]($style)'

[custom.disk_usage]
description = "Used % of root filesystem"
command     = "df -h / | awk 'NR==2{print $5}'"
when        = "true"
style       = "bg:color_seg3"
format      = '[[ 󰋊 $output ](fg:color_fg bg:color_seg3)]($style)'

[line_break]
disabled = false

[character]
disabled                  = false
success_symbol            = '[❯](bold blink fg:color_ok)'
error_symbol              = '[❯](bold blink fg:color_err)'
vimcmd_symbol             = '[❮](bold fg:color_ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_warn)'
vimcmd_replace_symbol     = '[❮](bold fg:color_warn)'
vimcmd_visual_symbol      = '[❮](bold fg:color_warn)'

[cmd_duration]
format   = '[  $duration ](bg:color_seg4 fg:color_fg)'
disabled = false

[shell]
disabled             = false
bash_indicator       = ''
fish_indicator       = '󰈺'
zsh_indicator        = "󰰶"
powershell_indicator = ''
cmd_indicator        = ''
ion_indicator        = ''
elvish_indicator     = "󰘧"
tcsh_indicator       = "󰰤"
nu_indicator         = "❯"
xonsh_indicator      = ""
unknown_indicator    = ''
style                = "bg:color_seg0"
format               = '[[ $indicator ](fg:color_fg bg:color_seg0)]($style)'

[sudo]
symbol   = ''
disabled = false
style    = "bg:color_seg0"
format   = '[[ $symbol ](fg:color_fg bg:color_seg0)]($style)'

[shlvl]
symbol   = ''
disabled = false
style    = "bg:color_seg0"
format   = '[[ $symbol $shlvl ](fg:color_fg bg:color_seg0)]($style)'

[battery]
disabled           = true
format             = '[[ $symbol $percentage ](fg:color_fg bg:color_seg5)](bg:color_seg5)'
full_symbol        = "󰁹 "
charging_symbol    = "󰂄 "
discharging_symbol = "󰁽 "
empty_symbol       = "󰂎 "

[[battery.display]]
threshold = 100
style     = "bg:color_seg5"

[status]
disabled = false
style    = "bg:color_seg5"
format   = '[[ $status:$common_meaning ](fg:color_err bg:color_seg5)]($style)'

[jobs]
symbol           = ''
number_threshold = 1
symbol_threshold = 1
disabled         = false
style            = "bg:color_seg5"
format           = '[[ $symbol $number ](fg:color_fg bg:color_seg5)]($style)'

