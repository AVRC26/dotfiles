# Starship Prompt — powerline layout, colors driven by set-theme.
# Credit: https://starship.rs/presets/plain-text-symbols

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color_seg0)\
$shell\
$sudo\
$shlvl\
$env_var\
[{{SEP_TRANS}}](bg:color_seg1 fg:color_seg0)\
$memory_usage\
[{{SEP_TRANS}}](bg:color_seg2 fg:color_seg1)\
${custom.cpu_load}\
[{{SEP_TRANS}}](bg:color_seg3 fg:color_seg2)\
${custom.disk_usage}\
[{{SEP_TRANS}}](bg:color_seg4 fg:color_seg3)\
$cmd_duration\
[{{SEP_TRANS}}](bg:color_seg5 fg:color_seg4)\
$battery\
$status\
$jobs\
[{{SEP_TRANS}}](bg:none fg:color_seg5)\
$line_break\
[](fg:color_seg0)\
$os\
[{{SEP_TRANS}}](bg:color_bg fg:color_seg0)\
$username\
$hostname\
[{{SEP_TRANS}}](bg:color_seg1 fg:color_bg)\
$directory\
[{{SEP_TRANS}}](fg:color_seg1 bg:color_seg2)\
$git_branch\
$git_status\
$git_commit\
$git_metrics\
[{{SEP_TRANS}}](fg:color_seg2 bg:color_seg3)\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haxe\
$helm\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mise\
$mojo\
$nats\
$nim\
$nix_shell\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$red\
$rlang\
$ruby\
$scala\
$rust\
$spack\
$swift\
$typst\
$vagrant\
$vlang\
$xmake\
$zig\
[{{SEP_TRANS}}](fg:color_seg3 bg:color_seg4)\
$aws\
$azure\
$container\
$docker_context\
$gcloud\
$guix_shell\
$kubernetes\
$terraform\
$netns\
$openstack\
$pixi\
$singularity\
$cpp\
[{{SEP_TRANS}}](fg:color_seg4 bg:color_seg5)\
$time\
[](fg:color_seg5)\
$line_break\
$character"""

palette = 'theme'

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[os]
disabled = false
style    = "bg:color_seg0 fg:color_bg"
format   = "[ $symbol ]($style)"

[os.symbols]
AIX              = "➿"
Alpaquita        = ""
Alpine           = ""
AlmaLinux        = ""
ALTLinux         = "Ⓐ"
Amazon           = ""
Android          = ""
AOSC             = "🐱"
Arch             = ""
Artix            = ""
Bluefin          = "🐟"
CachyOS          = ""
CentOS           = ""
Debian           = ""
DragonFly        = ""
Elementary       = "🍏"
Emscripten       = ""
EndeavourOS      = ""
Fedora           = ""
FreeBSD          = ""
Garuda           = "󰛓"
Gentoo           = ""
HardenedBSD      = "󰞌"
Illumos          = ""
Ios              = "📱"
InstantOS        = "⏲️"
Kali             = ""
Linux            = ""
Mabox            = ""
Macos            = ""
Manjaro          = ""
Mariner          = ""
MidnightBSD      = ""
Mint             = ""
NetBSD           = ""
NixOS            = ""
Nobara           = ""
OpenBSD          = ""
OpenCloudOS      = ""
openEuler        = ""
openSUSE         = ""
OracleLinux      = ""
PikaOS           = "🐤"
Pop              = ""
Raspbian         = ""
Redhat           = ""
RedHatEnterprise = ""
Redox            = "󰀘"
RockyLinux       = ""
Solus            = "󰠳"
SUSE             = ""
Ubuntu           = ""
Ultramarine      = "󰼮"
Unknown          = ""
Void             = ""
Windows          = ""
Zorin            = "🔹"

[username]
show_always = true
style_user  = "bg:color_bg fg:color_text"
style_root  = "bg:color_bg fg:color_text"
format      = '[ $user ]($style)'

[hostname]
ssh_only = false
style    = "bg:color_bg fg:color_text"
format   = '[ $hostname ]($style)'

[directory]
style             = "fg:color_fg bg:color_seg1"
format            = "[ $read_only$path ]($style)"
read_only         = '󰌾 '
home_symbol       = " "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[directory.substitutions]
"Documents" = "󰈘 "
"Downloads" = "󰆚 "
"Music"     = "󰝚 "
"Pictures"  = "󰏠 "
"Developer" = "󰬫 "

[git_branch]
symbol = ""
style  = "bg:color_seg2"
format = '[[ $symbol $branch ](fg:color_fg bg:color_seg2)]($style)'

[git_status]
style       = "bg:color_seg2"
format      = '[[($all_status$ahead_behind )](fg:color_fg bg:color_seg2)]($style)'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'bg:color_seg2'
format             = '[[ $hash$tag ](fg:color_fg bg:color_seg2)]($style)'

[git_metrics]
added_style   = 'bg:color_seg2 fg:color_fg'
deleted_style = 'bg:color_seg2 fg:color_fg'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false

[cpp]
symbol = ""
style  = "bg:color_seg3"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_seg3)]($style)'

[time]
disabled = false
style    = "bg:color_seg5"
format   = '[[  $time ](fg:color_fg bg:color_seg5)]($style)'

