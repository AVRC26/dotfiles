charging_symbol    = "󰂄"
discharging_symbol = "󰁽"
empty_symbol       = "󰂎"
format             = '[ $symbol $percentage ](bg:color_seg6 fg:color_fg) '

[[battery.display]]
threshold = 100
style     = "bg:color_seg6 fg:color_fg"

[os]
disabled = false
style    = "bg:color_seg0 fg:color_bg"
