# Starship Prompt — nerd-font layout, colors driven by set-theme.
# Credit: https://starship.rs/presets/nerd-font

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$memory_usage\
${custom.cpu_load}\
${custom.disk_usage}\
$line_break\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_metrics\
$c\
$cpp\
$cmake\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$nim\
$nodejs\
$bun\
$perl\
$php\
$python\
$ruby\
$rust\
$scala\
$swift\
$terraform\
$zig\
$conda\
$docker_context\
$fill\
$time\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = 'theme'

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[os]
disabled = false
style    = "fg:color_seg0"

[os.symbols]
AIX              = " 󰌓"
AlmaLinux        = " 󱄚"
Alpine           = " 󰌓"
Amazon           = " 󰌓"
Android          = " 󰀲"
AOSC             = " 󰌓"
Arch             = " 󰄇"
Artix            = " 󰄇"
CentOS           = " 󰕗"
Debian           = " 󰍺"
DragonFly        = " 󰌓"
Elementary       = " 󰻑"
EndeavourOS      = " 󰌓"
Fedora           = " 󰍻"
FreeBSD          = " 󰌓"
Garuda           = " 󰌓"
Gentoo           = " 󰏨"
Linux            = " 󰌓"
Macos            = " 󰅵"
Manjaro          = " 󰏷"
Mint             = " 󰍨"
NixOS            = " 󱄅"
OpenBSD          = " 󰌓"
openSUSE         = " 󰮂"
Pop              = " 󰪠"
Raspbian         = " 󰃿"
Redhat           = " 󱄛"
RedHatEnterprise = " 󱄛"
RockyLinux       = " 󰮤"
SUSE             = " 󰮂"
Ubuntu           = " "
Unknown          = " 󰠥"
Void             = " 󰰪"
Windows          = " 󰍲"

[username]
show_always = true
style_user  = "fg:color_text"
style_root  = "fg:color_err bold"
format      = '[ $user ]($style)'

[hostname]
ssh_only = false
style    = "fg:color_seg5"
format   = '[  $hostname ]($style)'

[directory]
style         = "fg:color_seg1"
format        = "[ $path ]($style)"
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false
read_only     = " 󰌾"

[directory.substitutions]
"Documents" = "󰈘 "
"Downloads" = "󰆚 "
"Music"     = "󰝚 "
"Pictures"  = "󰏠 "
"Developer" = "󰬫 "

[git_branch]
symbol = " "
style  = "fg:color_seg2"
format = '[$symbol$branch]($style) '

[git_status]
style  = "fg:color_err"
format = '([$all_status$ahead_behind]($style) )'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'fg:color_seg2'
format             = '[$hash$tag ]($style)'

[git_metrics]
added_style   = 'fg:color_ok'
deleted_style = 'fg:color_err'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false
[nodejs]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[bun]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[c]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[cpp]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[cmake]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[dart]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[deno]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[dotnet]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[elixir]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[elm]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[erlang]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[golang]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[haskell]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[java]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[julia]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[kotlin]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[lua]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[nim]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[perl]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[php]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[python]
symbol = " "
style  = "fg:color_seg3"
format = '[ $symbol($version) (\($virtualenv\)) ]($style)'

[ruby]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[rust]
symbol = "󱘗 "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[scala]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[swift]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[terraform]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[zig]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol($version )]($style)'

[conda]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol$environment ]($style)'
ignore_base = false

[docker_context]
symbol = " "
style  = "fg:color_seg3"
format = '[$symbol$context ]($style)'

[memory_usage]
disabled  = false
threshold = -1
style     = "fg:color_seg1"
format    = '[ 󰍛 ${ram_pct} ]($style)'

[custom.cpu_load]
description = "1-minute load average"
command = "awk '{print $1}' /proc/loadavg"
when = "true"
style = "fg:color_seg2"
format = '[ 󰻠 $output ]($style)'

[custom.disk_usage]
description = "Used % of root filesystem"
command = "df -h / | awk 'NR==2{print $5}'"
when = "true"
style = "fg:color_seg3"
format = '[ 󰋊 $output ]($style)'

[fill]
symbol = " "

[time]
disabled    = false
style       = "fg:color_seg5"
format      = '[ $time ]($style)'

[line_break]
disabled = false

[character]
disabled       = false
success_symbol = '[❯](bold blink fg:color_ok)'
error_symbol   = '[❯](bold blink fg:color_err)'
vimcmd_symbol  = '[❮](bold fg:color_ok)'

[cmd_duration]
show_milliseconds  = false
format             = '[ $duration](fg:color_warn)'
disabled           = false
