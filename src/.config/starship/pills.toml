[memory_usage]
format    = '[](fg:color_seg1)[ 󰍛 ${ram_pct} ](bg:color_seg1 fg:color_fg)[](fg:color_seg1)'
threshold = -1
disabled  = false

[custom.cpu_load]
description = "1-minute load average"
command = "awk '{print $1}' /proc/loadavg"
when = "true"
format = ' [](fg:color_seg2)[ 󰻠 $output ](bg:color_seg2 fg:color_fg)[](fg:color_seg2)'

[custom.disk_usage]
description = "Used % of root filesystem"
command = "df -h / | awk 'NR==2{print $5}'"
when = "true"
format = ' [](fg:color_seg3)[ 󰋊 $output ](bg:color_seg3 fg:color_fg)[](fg:color_seg3)'

[time]
disabled    = false
style       = "bg:color_seg0 fg:color_fg"
format      = ' [](fg:color_seg0)[ $time ](bg:color_seg0 fg:color_fg)[](fg:color_seg0)'
