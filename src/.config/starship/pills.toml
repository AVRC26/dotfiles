# Starship Prompt — pills layout, colors driven by set-theme.
# Credit: https://github.com/TaouMou/starship-presets

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭╴](fg:color_seg5)\
$os\
$username\
$hostname\
$directory\
($git_branch\
$git_status\
$git_commit\
$git_metrics\
[](fg:color_seg2) \
)\
($python\
$nodejs\
$conda\
)\
$time\
$cmd_duration
[╰─](fg:color_seg5)$character\
"""

add_newline = true
palette = 'theme'

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[username]
show_always = true
style_user = 'bg:color_bg fg:color_text'
style_root = 'bg:color_err fg:color_text'
format = '[](fg:color_bg)[ $user ](bg:color_bg fg:color_text)'

[hostname]
ssh_only = false
style = 'bg:color_bg fg:color_text'
format = '[  $hostname ]($style)[](fg:color_bg) '

[directory]
style = 'fg:color_fg bg:color_seg1'
format = '[](fg:color_seg1)[ $path ]($style)[$read_only]($style)[](fg:color_seg1) '
truncation_length = 0
truncation_symbol = ''
truncate_to_repo = false
read_only = '  '

[git_branch]
symbol = ' '
format = '[](fg:color_seg2)[  $branch ](bg:color_seg2 fg:color_fg)'

[git_status]
style  = 'bg:color_seg2 fg:color_fg'
format = '([$all_status$ahead_behind ]($style))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'bg:color_seg2 fg:color_fg'
format             = '([$hash$tag ]($style))'

[git_metrics]
added_style   = 'bg:color_seg2 fg:color_fg'
deleted_style = 'bg:color_seg2 fg:color_fg'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false

[python]
symbol = ' '
version_format = '${raw}'
disabled = false
format = ' [](fg:color_seg4)[$symbol${pyenv_prefix}(${version} )(\($virtualenv\))](bg:color_seg4 fg:color_fg)[](fg:color_seg4)'

[nodejs]
version_format = '${raw}'
disabled = false
format = ' [](fg:color_seg4)[  $version](bg:color_seg4 fg:color_fg)[](fg:color_seg4)'

[conda]
ignore_base = false
disabled = false
format = ' [](fg:color_seg4)[  $environment](bg:color_seg4 fg:color_fg)[](fg:color_seg4)'

[cmd_duration]
min_time = 500
format = ' [](fg:color_warn)[ $duration](bg:color_warn fg:color_fg)[](fg:color_warn)'

[character]
success_symbol = '[❯](bold blink fg:color_ok)'
error_symbol   = '[❯](bold blink fg:color_err)'
vimcmd_symbol  = '[❮](bold fg:color_ok)'

[os]
style = 'fg:color_fg bg:color_seg0'
format = '[](fg:color_seg0)[ $symbol ]($style)[](fg:color_seg0) '
disabled = false

[os.symbols]
Alpine           = '󰌓'
Amazon           = '󰌓'
Android          = '󰀲'
Arch             = '󰄇'
CentOS           = '󰕗'
Debian           = '󰍺'
EndeavourOS      = '󰌓'
Fedora           = '󰍻'
FreeBSD          = '󰌓'
Garuda           = '󰌓'
Gentoo           = '󰏨'
Linux            = '󰌓'
Macos            = '󰅵'
Manjaro          = '󰏷'
Mariner          = '󰌓'
Mint             = '󰍨'
NetBSD           = '󰌓'
NixOS            = '󱄅'
OpenBSD          = '󰌓'
OpenCloudOS      = '󰌓'
openEuler        = '󰌓'
openSUSE         = '󰮂'
OracleLinux      = '⊂⊃'
Pop              = '󰪠'
Raspbian         = '󰃿'
Redhat           = '󱄛'
RedHatEnterprise = '󱄛'
Solus            = '󰌓'
SUSE             = '󰮂'
Ubuntu           = ''
Unknown          = '󰠥'
Windows          = '󰍲'

[time]
disabled    = false
style       = "bg:color_seg5 fg:color_fg"
format      = '[](fg:color_seg5)[ $time ](bg:color_seg5 fg:color_fg)[](fg:color_seg5)'

[docker_context]
disabled = true

[package]
disabled = true
