# Starship Prompt — pills layout, colors driven by set-theme.
# Credit: https://github.com/TaouMou/starship-presets

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭╴](fg:color_seg5)\
$shell\
$sudo\
$shlvl\
$env_var\
$memory_usage\
${custom.cpu_load}\
${custom.disk_usage}\
$cmd_duration\
$battery\
$status\
$jobs\
$line_break\
[├╴](fg:color_seg5)\
$os\
$username\
$hostname\
$directory\
($git_branch\
$git_status\
$git_commit\
$git_metrics\
[](fg:color_seg2))\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haxe\
$helm\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mise\
$mojo\
$nats\
$nim\
$nix_shell\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$red\
$rlang\
$ruby\
$scala\
$rust\
$spack\
$swift\
$typst\
$vagrant\
$vlang\
$xmake\
$zig\
$aws\
$azure\
$container\
$docker_context\
$gcloud\
$guix_shell\
$kubernetes\
$terraform\
$netns\
$openstack\
$pixi\
$singularity\
$time
[╰─](fg:color_seg5)$character\
"""

add_newline = true
palette = 'theme'

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[username]
show_always = true
style_user = 'bg:color_bg fg:color_text'
style_root = 'bg:color_err fg:color_text'
format = '[](fg:color_bg)[ $user ](bg:color_bg fg:color_text)'

[hostname]
ssh_only = false
style = 'bg:color_bg fg:color_text'
format = '[ $hostname ]($style)[](fg:color_bg) '

[directory]
style = 'fg:color_fg bg:color_seg1'
format = '[](fg:color_seg1)[ $read_only$path ]($style)[](fg:color_seg1) '
read_only = '󰌾 '
home_symbol=" "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[git_branch]
symbol = ''
format = '[](fg:color_seg2)[  $branch ](bg:color_seg2 fg:color_fg)'

[git_status]
style  = 'bg:color_seg2 fg:color_fg'
format = '([$all_status$ahead_behind ]($style))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

[git_commit]
only_detached      = true
commit_hash_length = 8
tag_disabled       = false
tag_symbol         = '  '
style              = 'bg:color_seg2 fg:color_fg'
format             = '([$hash$tag ]($style))'

[git_metrics]
added_style   = 'bg:color_seg2 fg:color_fg'
deleted_style = 'bg:color_seg2 fg:color_fg'
format        = '([+$added ]($added_style)[-$deleted ]($deleted_style))'
disabled      = false

[cmd_duration]
format = ' [](fg:color_seg4)[  $duration](bg:color_seg4 fg:color_fg)[](fg:color_seg4) '
disabled = false

[shell]
disabled = false
bash_indicator = ''
fish_indicator='󰈺'
zsh_indicator="󰰶"
powershell_indicator = ''
cmd_indicator = ''
ion_indicator = ''
elvish_indicator = "󰘧"
tcsh_indicator = "󰰤"
nu_indicator = "❯"
xonsh_indicator = ""
unknown_indicator = ''
format   = '[](fg:color_seg0)[ $indicator ](bg:color_seg0 fg:color_fg)[](fg:color_seg0) '

[sudo]
symbol = ''
disabled = false
format   = '[](fg:color_seg0)[ $symbol ](bg:color_seg0 fg:color_fg)[](fg:color_seg0) '

[shlvl]
symbol = ''
disabled = false
format   = '[](fg:color_seg0)[ $symbol $shlvl ](bg:color_seg0 fg:color_fg)[](fg:color_seg0) '

[battery]
disabled = true
format   = '[](fg:color_seg5)[ $symbol $percentage ](bg:color_seg5 fg:color_fg)[](fg:color_seg5) '

full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰁽"
empty_symbol = "󰂎"
[[battery.display]]
threshold = 100
style     = 'bg:color_seg5 fg:color_fg'

[status]
disabled = false
format   = '[](fg:color_seg5)[ $status:$common_meaning ](bg:color_seg5 fg:color_err)[](fg:color_seg5) '

[jobs]
symbol = ''
number_threshold = 1
symbol_threshold = 1
disabled = false
format           = '[](fg:color_seg5)[ $symbol $number ](bg:color_seg5 fg:color_fg)[](fg:color_seg5) '


[buf]
symbol = ''
disabled = false
format = ' [](fg:color_seg3)[ $symbol $version](bg:color_seg3 fg:color_fg)[](fg:color_seg3)'

