# =========src ctrl=========

[git_branch]
symbol = "" #              |
style  = "fg:color_fg bg:color_seg2"
format = '[ $symbol $branch ]($style)'

[git_status]
style       = "bg:color_seg2 fg:color_fg"
format      = '([ $all_status$ahead_behind ](bg:color_seg2 fg:color_fg))'
conflicted  = "$count "
ahead       = "$count"
behind      = "$count"
diverged    = "$count"
up_to_date  = ""
untracked   = "$count "
stashed     = "$count "
modified    = "$count "
staged      = "$count "
renamed     = "$count "
deleted     = "$count "
typechanged = "$count "

#[git_status]
#style = "fg:color_fg bg:color_seg2"
#format = '[ $all_status$ahead_behind ]($style)'#"[ $ahead$behind$untracked$modified$staged$deleted ]($style)"
#conflicted = '󰞇= $count'
#ahead = "⇡ $count "
#behind = "⇣ $count "
#deleted = "🗑 $count " #
#diverged = "󰃻 $count " #
#renamed = " $count "
#stashed = "📦 $count "
#modified = "󰙏 $count " #  
#staged = " $count "
#untracked = "󰙌 $count " # 🤷󰙌
#up_to_date = '✓'

[git_commit]
disabled      = true
only_detached = false
tag_disabled  = false
tag_symbol    = ' '
# tag_max_candidates=1
style              = "fg:color_fg bg:color_seg2"
format             = "[$symbol$hash$tag ]($style)"
commit_hash_length = 4

[git_state]
disabled     = false
style        = "bg:color_seg2"
format       = '\([$state( $progress_current/$progress_total)]($style)\) '
cherry_pick  = '[🍒 PICKING]'
rebase       = '[ REBASING]'
merge        = '[ MERGING]'
bisect       = '[🔍 BISECTING]'
am           = '[AM]'
am_or_rebase = '[AM/REBASE]'
revert       = '[󰕍 REVERTING]'
#progress_divider = ' of '

[git_metrics]
added_style   = "fg:color_fg bg:color_seg2"
deleted_style = "fg:color_fg bg:color_seg2"
format        = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
disabled      = false

[fossil_branch]
symbol = '󰘬'
style  = "bg:color_seg2"
format = '[[ $symbol $branch ](fg:color_fg bg:color_seg2)]($style)'

[fossil_metrics]
added_style   = "fg:color_fg bg:color_seg2"
deleted_style = "fg:color_fg bg:color_seg2"
format        = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[hg_branch]
