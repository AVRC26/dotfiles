# ========time/shell/shlvl/jobs/memory_usage==========

[time]
disabled = false
style    = "bg:color_seg6"
format   = '[[  $time ](fg:color_fg bg:color_seg6)]($style)'

[shell]
disabled             = false
bash_indicator       = ''
fish_indicator       = '󰈺'
zsh_indicator        = "󰰶"
powershell_indicator = ''
cmd_indicator        = ''
ion_indicator        = ''
elvish_indicator     = "󰘧"
tcsh_indicator       = "󰰤"
nu_indicator         = "❯"
xonsh_indicator      = ""
unknown_indicator    = ''
style                = "fg:color_fg bg:color_seg0"
format               = "[ $indicator ]($style)" #space on right b/c double-width symbol

[shlvl]
disabled = false
symbol   = ""
style    = "fg:color_fg bg:color_seg0"
format   = '[ $symbol $shlvl ]($style)'

[jobs]
disabled         = false
symbol           = ''
number_threshold = 1
symbol_threshold = 1
style            = "fg:color_fg bg:color_seg6"
format           = "[ $symbol $number ]($style)"

[memory_usage]
disabled  = false
threshold = -1
symbol    = "󰍛"
style     = "fg:color_fg bg:color_seg1"
format    = '[ $symbol ${ram_pct} ]($style)[](bg:color_seg2 fg:color_seg1)'

[custom.cpu_load]
description = "1-minute load average"
command     = "awk '{print $1}' /proc/loadavg"
symbol      = "󰻠"
style       = "fg:color_fg bg:color_seg2"
format      = '[ $symbol $output ]($style)[](bg:color_seg3 fg:color_seg2)'
when        = "true"

[custom.disk_usage]
description = "Used % of root filesystem"
command     = "df -h / | awk 'NR==2{print $5}'"
symbol      = "󰋊"
style       = "fg:color_fg bg:color_seg3"
format      = '[ $symbol $output ]($style)[](bg:color_seg4 fg:color_seg3)'
when        = "true"
