# ==========battery========

[battery]
full_symbol        = "󰁹"
charging_symbol    = "󰂄"
discharging_symbol = "󰁽"
empty_symbol       = '󰂎'
format             = "[$symbol$percentage]($style)"
disabled           = true

# [[battery.display]]
# threshold = 25
# style = "bold fg:fg_red2 bg:color_seg4"

# [[battery.display]]
# threshold = 50
# style = "bold fg:orange bg:color_seg4"

# [[battery.display]]
# threshold = 75
# style = "bold fg:yellow bg:color_seg4"

[[battery.display]]
threshold = 100
style     = "fg:color_fg bg:color_seg6"
# style = "bold fg:green bg:color_seg4"

# ==========status========

[cmd_duration] #    
format = '[  $duration ]($style)'
style  = 'fg:color_fg bg:color_seg4'

[character]
disabled       = false
success_symbol = '[❯](bold blink fg:color_ok)'
error_symbol   = '[❯](bold blink fg:color_err)'
vimcmd_symbol  = '[❮](bold fg:color_ok)'

[status]
disabled = false
format   = '[ $status:$common_meaning ](fg:color_err bg:color_seg6)'

[sudo]
symbol   = "" #
style    = "fg:color_fg bg:color_seg0"
disabled = false

# =========user/host=========

[env_var.STY]
#variable = 'STY'
style  = "fg:color_fg bg:color_seg0"
format = "[ $env_value ]($style)"
# default=""
# disabled = true

[hostname]
format   = '[ $hostname ](bg:color_bg fg:color_text)'
ssh_only = false
disabled = false

[username] #          
show_always = true
style_user  = "bg:color_bg fg:color_text"
style_root  = "bg:color_bg fg:color_err bold"
format      = '[ ($user) ]($style)'

[localip]
ssh_only = true
style    = "fg:color_fg bg:color_seg0"
format   = '[󰩠 $localipv4]($style)' #@
disabled = true

# ========directory==========

[directory]
style             = "fg:color_fg bg:color_seg1"
format            = "[$read_only$path ]($style)"
read_only         = '󰌾 '
home_symbol       = " "
truncation_length = 0
truncation_symbol = ""
truncate_to_repo  = false

[direnv]
style  = "fg:color_fg bg:color_seg1"
format = "[ $symbol $loaded/$allowed ]($style)"
symbol = ""
# detect_files=['.envrc']
# detect_folders=[]
# detect_env_vars=['TESTDIRENV']
allowed_msg     = " "
not_allowed_msg = " "
denied_msg      = " "
loaded_msg      = " "
unloaded_msg    = " "
disabled        = false

