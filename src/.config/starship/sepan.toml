# Refresh
#eval "$(starship init bash)"
#
#    ~   󰈙      🔑     
# fade_left: =       
# fade_right: =       
# end_left: =  
# end_right: =  
#
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Disable the blank line at the start of the prompt
add_newline = true
palette     = 'theme'

# =========prompt=========

format = """
[](bg:none fg:color_seg0)\
$shell\
$sudo\
$shlvl\
$env_var\
[](bg:color_seg0 fg:color_bg)\
[](fg:color_bg)\
[](fg:color_bg)\
[](fg:color_bg bg:color_seg1)\
$memory_usage\
${custom.cpu_load}\
${custom.disk_usage}\
$cmd_duration\
[](fg:color_seg4 bg:color_seg6)\
$battery\
$status\
$jobs\
[](fg:color_seg6 bg:none)\
$line_break\
[](bg:none fg:color_seg0)\
$os\
[](bg:color_seg0 fg:color_bg)\
[](fg:color_bg)\
[](fg:color_bg)\
$username\
$hostname\
$localip\
[ ](fg:color_bg bg:color_seg1)\
$directory\
$direnv\
[ ](fg:color_seg1 bg:color_seg2)\
$git_branch\
$git_status\
$git_metrics\
$git_commit\
$git_state\
$fossil_branch\
$fossil_metrics\
$hg_branch\
$hg_state\
$pijul_channel\
$vcs\
$vcsh\
[ ](fg:color_seg2 bg:color_seg3)\
$buf\
$bun\
$c\
$cmake\
$cobol\
$conda\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
