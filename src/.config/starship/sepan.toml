#${custom.files}${custom.directories}\

# A continuation prompt that displays right half-circle and filled-in arrow
continuation_prompt = "[ ](bg:color_seg6)[ ](fg:color_seg6)"

#the continuation prompt may not be shown if the right prompt is used; RP only appears in fish/zsh/xonsh, not bash/pwsh/tcsh/ion
# right_format = """
# [ ](fg:color_seg6)\
# [ ](fg:color_seg4 bg:color_seg6)\
# [ ](fg:color_seg0 bg:color_seg4)\
# [test](fg:color_fg bg:color_seg0)\
# [](fg:color_seg0)\
# """

follow_symlinks = false

[palettes.theme]
color_seg0 = "{{COLOR_SEG0}}"
color_seg1 = "{{COLOR_SEG1}}"
color_seg2 = "{{COLOR_SEG2}}"
color_seg3 = "{{COLOR_SEG3}}"
color_seg4 = "{{COLOR_SEG4}}"
color_seg5 = "{{COLOR_SEG5}}"
color_seg6 = "{{COLOR_SEG6}}"
color_bg   = "{{COLOR_BG}}"
color_text = "{{COLOR_TEXT}}"
color_fg   = "{{COLOR_FG}}"
color_ok   = "{{COLOR_OK}}"
color_err  = "{{COLOR_ERR}}"
color_warn = "{{COLOR_WARN}}"

[line_break]
disabled = false

